<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/componentes.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/paginas/presenca.css') }}">
  <title>Presença (Chamada)</title>
</head>
<body data-pagina="presenca">

  <div id="sidebar"></div>

    <!-- Area Principal -->
    <main class="content">

      <div class="container-chamada">

        <!-- Cabecalho -->
        <div class="cabecalho-chamada">
          <h1>Chamada</h1>
          <p>Gerencie a frequência dos alunos</p>
        </div>

        <!-- Data da aula e botão de salvar -->
        <div class="barra-chamada">
          <label for="data-aula">Data da aula:</label>
          <input type="date" id="data-aula">
          <button type="button" id="btn-salvar-chamada" class="btn-salvar-chamada">Salvar chamada</button>
          <span id="msg-chamada" class="msg-chamada"></span>
        </div>

        <!-- 4 Cartões de Métricas -->
        <div class="grid-cards-chamada">

          <div class="card-metrica card-azul">
            <div class="card-topo">
              <div class="icone-box box-azul"><img src="{{ url_for('static', filename='images/users-branco.png') }}" alt=""></div>
              <span class="card-label">TOTAL DE ALUNOS</span>
            </div>
            <div class="card-valor" id="valor-total">45</div>
          </div>

          <div class="card-metrica card-verde">
            <div class="card-topo">
              <div class="icone-box box-verde"><img src="{{ url_for('static', filename='images/check-branco.png') }}" alt=""></div>
              <span class="card-label">PRESENTES</span>
            </div>
            <div class="card-valor" id="valor-presentes">38</div>
          </div>

          <div class="card-metrica card-vermelho">
            <div class="card-topo">
              <div class="icone-box box-vermelha"><img src="{{ url_for('static', filename='images/X-branco.png') }}" alt=""></div>
              <span class="card-label">AUSENTES</span>
            </div>
            <div class="card-valor" id="valor-ausentes">7</div>
          </div>

          <div class="card-metrica card-roxo">
            <div class="card-topo">
              <div class="icone-box box-roxa"><span class="simbolo-percent">%</span></div>
              <span class="card-label">TAXA DE PRESENÇA</span>
            </div>
            <div class="card-valor" id="valor-taxa">84%</div>
          </div>

        </div>

        <!-- Tabela de chamada -->
        <div class="caixa-tabela-chamada">

          <!-- Barra de acoes da tabela -->
          <div class="tabela-acoes">
            <div class="selecao-info">
              <input type="checkbox" id="check-todos" title="Selecionar todos">
              <span class="texto-selecionados" id="texto-selecionados">Nenhum aluno selecionado</span>
            </div>
            <div class="botoes-acao-chamada">
              <button class="btn-acao-verde" id="btn-marcar-presentes" type="button"><img src="{{ url_for('static', filename='images/check-green.png') }}" alt=""> Marcar Presentes</button>
              <button class="btn-acao-vermelho" id="btn-marcar-ausentes" type="button"><img src="{{ url_for('static', filename='images/close-red.png') }}" alt=""> Marcar Ausentes</button>
            </div>
          </div>

          <!-- Tabela frequencia -->
          <div class="tabela-scroll">
          <table class="tabela-frequencia">
            <thead>
              <tr>
                <th style="width: 40px;"></th>
                <th>Matrícula</th>
                <th>NOME DO ALUNO</th>
                <th>STATUS DE PRESENÇA</th>
              </tr>
            </thead>
            <tbody>
              {% for id, nome in alunos %}
              <tr data-id="{{ id }}">
                <td><input type="checkbox"></td>
                <td>{{ id }}</td>
                <td>{{ nome }}</td>
                <td><span class="badge badge-presente">Presente</span></td>
              </tr>
              {% else %}
              <tr class="linha-vazia">
                <td colspan="4">Nenhum aluno inscrito ainda.</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
          </div> <!-- fecha tabela-scroll -->

        </div> <!-- fecha caixa-tabela-chamada -->

      </div> <!-- fecha container-chamada -->
    </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>

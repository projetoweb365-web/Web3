<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/layout.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/componentes.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/paginas/relatorios.css') }}">

    <title>Documentos</title>

</head>


<body>


<div id="sidebar"></div>


<main class="content">

    <div class="container-relatorios">


        <!-- =========================================
             ALTERNADOR
        ========================================== -->

        <nav class="toggle-pilula compacto">

            <a
                href="{{ url_for('pagina_relatorios') }}"
                class="toggle-btn">

                Relatórios

            </a>


            <a
                href="{{ url_for('pagina_documentos') }}"
                class="toggle-btn ativo">

                Documentos

            </a>

        </nav>


        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <div class="cabecalho-relatorios">

            <h1>Documentos</h1>

            <p>
                Envie e baixe documentos da ONG.
            </p>

        </div>


        <!-- =========================================
             UPLOAD
        ========================================== -->

        <div class="caixa-relatorios">

            <h2 class="titulo-caixa">
                ENVIAR ARQUIVO
            </h2>


            <form
                id="formUpload"
                enctype="multipart/form-data">


                <input
                    type="file"
                    id="arquivo"
                    name="arquivo"
                    accept=".pdf,.xlsx,.xls">


                <button
                    type="submit"
                    class="btn-exportar">

                    Enviar arquivo

                </button>


            </form>


            <p id="mensagem"></p>

        </div>


        <!-- =========================================
             ARQUIVOS
        ========================================== -->

        <div class="caixa-relatorios">

            <h2 class="titulo-caixa">
                ARQUIVOS DISPONÍVEIS
            </h2>


            <table border="1">

                <thead>

                    <tr>

                        <th>
                            Nome
                        </th>

                        <th>
                            Tipo
                        </th>

                        <th>
                            Data
                        </th>

                        <th>
                            Ação
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="listaArquivos">

                </tbody>

            </table>

        </div>


    </div>

</main>


<script>
  
// =====================================================
// CARREGAR ARQUIVOS
// =====================================================

async function carregarArquivos() {

    const resposta =
        await fetch("/arquivos");


    const arquivos =
        await resposta.json();


    const tabela =
        document.getElementById(
            "listaArquivos"
        );


    tabela.innerHTML = "";


    arquivos.forEach(function(arquivo) {

        const linha =
            document.createElement("tr");


        linha.innerHTML = `

            <td>
                ${arquivo.nome_original}
            </td>

            <td>
                ${arquivo.tipo}
            </td>

            <td>
                ${arquivo.data_upload}
            </td>

            <td>

                <a
                    href="/download/${arquivo.id}">

                    Baixar

                </a>

            </td>

        `;


        tabela.appendChild(
            linha
        );

    });

}



// =====================================================
// UPLOAD
// =====================================================

document
    .getElementById("formUpload")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const arquivo =
                document.getElementById(
                    "arquivo"
                ).files[0];


            if (!arquivo) {

                alert(
                    "Selecione um arquivo."
                );

                return;

            }


            const formulario =
                new FormData();


            formulario.append(
                "arquivo",
                arquivo
            );


            const resposta =
                await fetch(
                    "/upload",
                    {

                        method: "POST",

                        body: formulario

                    }
                );


            const resultado =
                await resposta.json();


            document.getElementById(
                "mensagem"
            ).textContent =
                resultado.mensagem
                ||
                resultado.erro;


            carregarArquivos();

        }
    );



// =====================================================
// CARREGAR AO ABRIR A PÁGINA
// =====================================================

carregarArquivos();
  
</script>


</body>

</html>

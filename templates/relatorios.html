<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas/relatorios.css">
  <title>Relatórios</title>
</head>
<body>

  <div id="sidebar"></div>

    <!-- Area Principal -->
    <main class="content">
      
      <div class="container-relatorios">
        <!-- Alternador Relatórios / Documentos -->
        <nav class="toggle-pilula compacto">
          <a href="relatorios.html" class="toggle-btn ativo">Relatórios</a>
          <a href="documentos.html" class="toggle-btn">Documentos</a>
        </nav>

        
        <!-- Cabecalho da Página -->
        <div class="cabecalho-relatorios">
          <h1>Relatórios</h1>
          <p>Filtros, relatórios e exportação de dados.</p>
        </div>

        <!-- Secao 1: Filtros Globais -->
        <div class="caixa-relatorios">
          <h2 class="titulo-caixa">FILTROS GLOBAIS</h2>
          
          <div class="grid-filtros">
            <!-- Filtro 1 -->
            <div class="item-filtro">
              <label>Período</label>
              <select class="select-filtro">
                <option>Mês atual</option>
                <option>Mês passado</option>
                <option>Personalizado</option>
              </select>
              <span class="ajuda-filtro">01/09/2026 - 21/09/2026</span>
            </div>
            
            <!-- Filtro 2 -->
            <div class="item-filtro">
              <label>Turma</label>
              <select class="select-filtro">
                <option>Turma A (2º Ano)</option>
                <option>Turma B (3º Ano)</option>
              </select>
            </div>
            
            <!-- Filtro 3 -->
            <div class="item-filtro">
              <label>Tipo de Dados</label>
              <select class="select-filtro">
                <option>Frequência</option>
                <option>Notas</option>
                <option>Inscrições</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Seção 2: Exportação de Dados -->
        <div class="caixa-relatorios">
          <h2 class="titulo-caixa">EXPORTAÇÃO DE DADOS</h2>
          
          <div class="grid-exportacao">
            
            <!-- Cartão PDF -->
            <div class="cartao-exportacao">
              <div class="icone-box icone-pdf">
                <img src="images/pdf-icon.png" alt="PDF">
              </div>
              <div class="conteudo-exportacao">
                <h3>GERAR RELATÓRIO PDF</h3>
                <p>Relatório de Frequência e Presença</p>
                <button class="btn-exportar">Exportar para PDF</button>
              </div>
            </div>
            
            <!-- Cartão Excel -->
            <div class="cartao-exportacao">
              <div class="icone-box icone-excel">
                <img src="images/xlsx-icon.png" alt="Excel">
              </div>
              <div class="conteudo-exportacao">
                <h3>EXPORTAR PLANILHA EXCEL</h3>
                <p>Tabela de Dados Brutos</p>
                <button class="btn-exportar">Exportar para Excel</button>
              </div>
            </div>

          </div>
        </div>

      </div>

    </main>

  <script src="js/script.js"></script>

</body>
</html>

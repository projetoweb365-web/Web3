<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/componentes.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/paginas/login.css') }}">
  <title>Acesso ao Sistema</title>
</head>
<body class="body-login">

  <div class="login-wrapper">
    
    <!-- Logotipo e titulo -->
    <div class="login-header">
      <img src="static/images/logo-fundoclaro.png" alt="Centro de Cidadania do Brasil">
      <h2>Acesso ao sistema de gestão.</h2>
    </div>

    <!-- Cartão branco de login -->
    <div class="login-card">
      
      <!-- Alternador entrar / criar Conta -->
      <div class="toggle-pilula">
        <button id="btn-tab-entrar" class="toggle-btn ativo" onclick="alternarAba('entrar')">Entrar</button>
        <button id="btn-tab-criar" class="toggle-btn" onclick="alternarAba('criar')">Criar Conta</button>
      </div>

      <!-- FORMULÁRIO 1: LOGIN -->
      <form id="form-login" action="/login" method="POST">
        <div class="form-group">
          <label for="email_login">E-mail</label>
          <input type="email" id="email_login" name="email" required>
        </div>

        <div class="form-group">
          <label for="senha_login">Senha</label>
          <input type="password" id="senha_login" name="senha" required>
        </div>

        <button type="submit" class="btn-verde">Entrar</button>
      </form>

      <!-- FORMULÁRIO 2: CRIAR CONTA (Escondido por padrão) -->
      <form id="form-cadastro" action="/cadastro" method="POST" style="display: none;">
        <div class="form-group">
          <label for="nome_cad">Nome</label>
          <input type="text" id="nome_cad" name="nome" required>
        </div>

        <div class="form-group">
          <label for="email_cad">E-mail</label>
          <input type="email" id="email_cad" name="email" required>
        </div>

        <div class="form-group">
          <label for="senha_cad">Senha</label>
          <input type="password" id="senha_cad" name="senha" required>
        </div>

        <button type="submit" class="btn-verde">Criar Conta</button>
      </form>

      <!-- Divisoria -->
      <div class="divisor">
        <span>ou</span>
      </div>

      <!-- Botao Google -->
      <button class="btn-google">
        <img src="static/images/google-icon.png" alt="Google">
        Continuar com Google
      </button>

    </div>

  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
